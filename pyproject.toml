[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-mcp-audit"
version = "2.3"
description = "Model Context Protocol (MCP) endpoint security auditor"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "mcp", "llm", "ai-security", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
]


[project.scripts]
vamp-mcp-audit = "vamp_mcp_audit:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-mcp-audit"
Repository = "https://github.com/Vampsecure-Labs/vamp-mcp-audit"

[tool.setuptools]
py-modules = ["vamp_mcp_audit"]
